name: Release APK

# Builds the Android APK and publishes it as a GitHub Release with Pitchside.apk attached.
# Run it from the Actions tab ("Run workflow"): the version is read from app.json and tagged vX.Y.Z.
# Pushing a tag like v1.2.0 does the same.
# The website's download button always points at the latest release's Pitchside.apk.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Read version
        id: v
        run: echo "tag=v$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Test & typecheck
        run: |
          npm test
          npm run typecheck

      - name: Generate native Android project
        run: CI=1 npx expo prebuild -p android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Pitchside.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pitchside-apk
          path: Pitchside.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Pitchside ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.v.outputs.tag }}
          body_path: .github/release-notes.md
          files: Pitchside.apk
